[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wbsdk"
version = "0.1.2"
description = "Python SDK для Wildberries API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "RTHeLL / Kinder"},
    { name = "WB SDK Contributors" }
]
keywords = ["wildberries", "api", "sdk", "marketplace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "respx>=0.20.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Documentation = "https://github.com/wbsdk/wbsdk#readme"
Repository = "https://github.com/wbsdk/wbsdk"

[tool.hatch.build.targets.wheel]
packages = ["src/wbsdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
